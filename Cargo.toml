# Host-side workspace (Windows MSVC): the Bevy window/renderer host, the launcher and Rust tools.
# The game DLL (Windows GNU) is its own workspace in crates/game because it links the generated code in generated/.
[workspace]
resolver = "2"
members = ["crates/host", "launcher"]
exclude = ["crates/game", "generated", "third_party"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/aidxnfr/wii-party-rust"

# Two small fixes to wgpu 30.0.1 (DX12 forced early depth, HLSL output); see third_party/README.md.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
naga = { path = "third_party/naga" }

[profile.dev]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.wprt-gx]
opt-level = 3
[profile.dev.package.wprt-host-controller]
opt-level = 3

[profile.release]
opt-level = 3
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
incremental = false
