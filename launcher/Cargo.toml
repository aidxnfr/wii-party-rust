[package]
name = "wii-party-launcher"
version = "0.1.0"
description = "Installs Wii Party (Rust) from your own disc and plays it"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
eframe = "=0.33.3"
rfd = "0.17.2"
ureq = "2.12.1"
sha2 = "0.11.1"
zip = "9.3.0"
flate2 = "1.1.10"
tar = "0.4.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
open = "5.4.5"

[build-dependencies]
zip = "9.3.0"
