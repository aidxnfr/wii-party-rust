# Builds the host (wii-party.exe) and the launcher on every push; on a version tag (v*) it publishes a release
# with wii-party-launcher.exe (source + host embedded). The game DLL itself is built on each player's PC from their disc.
name: build
permissions:
  contents: write   # publish releases on version tags

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Host
        run: cargo build --release -p wii-party-host
      - name: Launcher
        shell: pwsh
        run: |
          $env:WP_HOST_EXE = "$PWD\target\release\wii-party.exe"
          cargo build --release -p wii-party-launcher
      - name: Python tools compile
        run: python -m py_compile recompiler/pipeline.py recompiler/rust/translate.py recompiler/rust/cpp2rs.py recompiler/dsp/build_ax.py recompiler/dsp/prepare_ax.py tools/fixtures/run_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: wii-party-launcher
          path: target/release/wii-party-launcher.exe
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # docs/releases/<tag>.md holds each release's notes; the launcher's checksum is added at the end
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          $hash = (Get-FileHash target/release/wii-party-launcher.exe -Algorithm SHA256).Hash.ToLower()
          (Get-Content $notes -Raw) + "`n**wii-party-launcher.exe** sha256: ``$hash```n" | Set-Content release-body.md -Encoding utf8
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: target/release/wii-party-launcher.exe
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
